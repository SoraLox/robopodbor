# CI/CD SourceCraft.
# Документация: https://sourcecraft.dev/portal/docs/ru/sourcecraft/ci-cd-ref/
#
# Проверяет оба пакета: apps/web (lint, типы, тесты, сборка) и apps/api (типы, сборка).

on:
  pull_request:
    - workflows: [checks]
      filter:
        target_branches: ["main"]
  push:
    - workflows: [checks]
      filter:
        branches: ["main"]
    # Публикация Docker-образа — только после мержа в main.
    - workflows: [build-image]
      filter:
        branches: ["main"]

workflows:
  checks:
    tasks:
      - name: install
        cubes:
          - name: npm-ci
            image: node:22-alpine
            script:
              - cd apps/web
              - npm ci --no-audit --no-fund
            artifacts:
              paths:
                - apps/web/node_modules

      - name: lint-typecheck-test
        needs: [install]
        cubes:
          - name: lint
            image: node:22-alpine
            script:
              - cd apps/web
              - npm run lint
          - name: typecheck
            image: node:22-alpine
            script:
              - cd apps/web
              - npm run typecheck
          - name: test
            image: node:22-alpine
            script:
              - cd apps/web
              - npm run test

      # API раньше в CI не проверялся вовсе — так и потерялись маршруты,
      # которые фронт уже вызывал (/calculations, /parameters/import).
      - name: api-checks
        cubes:
          - name: api-typecheck-build
            image: node:22-alpine
            script:
              - cd apps/api
              - npm ci --no-audit --no-fund
              - npx prisma generate
              - npx prisma validate
              - npm run typecheck
              - npm run build

      - name: build
        needs: [lint-typecheck-test]
        cubes:
          - name: vite-build
            image: node:22-alpine
            script:
              - cd apps/web
              - npm run build
            artifacts:
              paths:
                - apps/web/dist

  # ШАГ 2 (после того как будет подключён Yandex Container Registry через
  # service connection — см. https://sourcecraft.dev/portal/docs/ru/sourcecraft/operations/service-connections):
  # заменить <registry>/<repo> на реальный путь в YCR и раскомментировать при готовности.
  build-image:
    tasks:
      - name: docker-build-push
        cubes:
          - name: build-and-push
            image:
              name: some-docker-registry.com/cloud-builders/docker
              entrypoint: ""
              username: ${{ secrets.REGISTRY_USERNAME }}
              password: ${{ secrets.REGISTRY_PASSWORD }}
            script:
              - docker build -t <registry>/<repo>/robopodbor-web:${{ ci.commit_sha }} -t <registry>/<repo>/robopodbor-web:latest -f apps/web/Dockerfile .
              - docker push <registry>/<repo>/robopodbor-web:${{ ci.commit_sha }}
              - docker push <registry>/<repo>/robopodbor-web:latest

