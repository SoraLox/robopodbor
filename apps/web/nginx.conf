# Файл подключается внутрь http {} (conf.d/*.conf), поэтому зоны и upstream объявлены здесь.

# Вход/регистрация считают scrypt — дорогую операцию. Без ограничения поток запросов
# на /api/auth/* съедает пул потоков API и тормозит все остальные запросы.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

# За Caddy nginx сам принимает запрос по http, но клиент пришёл по https: передаём
# в API исходную схему, иначе req.secure там всегда false.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

upstream api_backend {
  server api:4000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # За Caddy (профиль tls) клиентский адрес приходит в X-Forwarded-For, иначе rate limit
  # считал бы всех пользователей одним адресом прокси. Доверяем только частным сетям
  # docker; прямые запросы из интернета приходят с публичного адреса и не подменяются.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary application/wasm;

  include /etc/nginx/snippets/security-headers.conf;

  # SPA: любой маршрут отдаёт index.html, роутинг разбирает react-router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html ссылается на хешированные чанки — его нельзя кешировать, иначе после
  # деплоя браузер будет запрашивать чанки, которых уже нет.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # Vite кладёт в /assets только файлы с хешем в имени — их можно кешировать навсегда.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # public/ копируется без хеша: кешируем на неделю и перепроверяем в фоне.
  location ~* \.(webp|avif|png|jpe?g|svg|ico)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  location ~* \.glb$ {
    types { model/gltf-binary glb; }
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  # MSW-воркер в docker-сборке не регистрируется, но если он остался в браузере
  # с прошлой (моковой) версии, он должен обновиться сразу.
  location = /mockServiceWorker.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # Реальный бэкенд (apps/api) проксируется на тот же origin, что и фронт, чтобы
  # httpOnly-cookie сессии работали без настройки CORS/SameSite=None.
  location /api/auth/ {
    limit_req zone=auth burst=5 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
  }

  location /api/ {
    limit_req zone=api burst=60 nodelay;
    client_max_body_size 10m;
    include /etc/nginx/snippets/api-proxy.conf;
  }
}
