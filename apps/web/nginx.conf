server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: любой маршрут отдаёт index.html, роутинг разбирает react-router
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|svg|gltf|bin)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Реальный бэкенд (apps/api) в docker-compose поднят под именем "api".
  # Проксируем на одном origin с фронтом, чтобы httpOnly-cookie сессии
  # работали без настройки CORS/SameSite=None.
  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
